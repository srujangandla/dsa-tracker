<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tracker — Website Moved</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">

    <meta http-equiv="refresh" content="5;url=https://YOUR-VERCEL-URL.vercel.app">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Grotesk", sans-serif;
            background: #050816;
            color: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 50px 35px;
            text-align: center;
            border: 1px solid #26304a;
            border-radius: 20px;
            background: #0b1020;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 38px;
            font-weight: 800;
        }

        p {
            margin: 10px 0;
            color: #aeb8cc;
            font-size: 17px;
            line-height: 1.6;
        }

        .url {
            margin: 25px 0;
            padding: 14px;
            border-radius: 10px;
            background: #11182b;
            color: #00e5ff;
            word-break: break-all;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 25px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .redirect {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8ba3;
        }

        strong {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚀</div>

        <h1>Website Moved</h1>

        <p>
            The <strong>DSA Tracker</strong> has moved to a new website.
        </p>

        <p>
            Please use the new URL below to access the tracker.
        </p>

        <div class="url">
            https://dsa-tracker-silk-tau.vercel.app
        </div>

        <a
            class="button"
            href="https://dsa-tracker-silk-tau.vercel.app">
            🚀 Go to New Website
        </a>

        <div class="redirect">
            You will be automatically redirected in 5 seconds...
        </div>

    </div>

</body>
</html>
